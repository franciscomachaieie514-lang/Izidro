<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
<title>Izitrader</title>
<style>
*{box-sizing:border-box}:root{--bg:#0a0f1c;--card:#111a2e;--field:#131b2e;--text:#fff;--muted:#7c88a3;--border:#22304a;--accent:#e24b4a;--green:#35d492}body{margin:0;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;justify-content:center;padding:24px 12px 80px}.app{width:100%;max-width:900px}.header{display:flex;align-items:center;gap:10px;margin-bottom:20px}.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#b91c1c,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:900}.brand{font-size:20px;font-weight:700;margin-right:auto}.brand span{color:#ef4444}.header-actions{display:flex;gap:8px;position:relative}.icon-btn,.sair-btn{height:38px;border-radius:10px;background:var(--field);border:1px solid var(--border);color:var(--text);font-weight:700;cursor:pointer}.icon-btn{width:38px}.sair-btn{padding:0 16px}.menu{position:absolute;top:46px;right:92px;background:var(--card);border:1px solid var(--border);border-radius:12px;z-index:20;min-width:180px;display:none}.menu.open{display:block}.menu-item{padding:11px 14px;cursor:pointer}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}.balance{display:flex}.balance>div{flex:1}.divider{width:1px!important;flex:0 0 1px!important;background:var(--border);margin:0 16px}.label,.field-label{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}.value{font-size:22px;font-weight:700}.profit{color:var(--green)}.row3{display:grid;grid-template-columns:1fr 1.4fr .8fr;gap:10px;margin-bottom:16px}.pill,.select{width:100%;border-radius:12px;padding:12px;font-weight:700;text-align:center;background:var(--field);color:var(--text);border:1px solid var(--border)}.pill-aula{background:#d33;color:#fff}.dropdown{position:relative}.dropdown-btn{width:100%;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-weight:700;display:flex;justify-content:space-between;cursor:pointer}.dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;z-index:10;display:none;overflow:hidden}.dropdown-menu.open{display:block}.dropdown-item{padding:10px 14px;cursor:pointer}.dropdown-item:hover,.menu-item:hover{background:rgba(255,255,255,.06)}.dropdown-item .desc{font-size:11px;color:var(--muted)}.history{display:flex;gap:7px;overflow:auto}.history-item{min-width:100px;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:9px}.history-item .digit{font-size:18px;font-weight:800}.status{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 14px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e24b4a;margin-right:6px}.dot.ok{background:var(--green)}.wheel-wrap{display:flex;justify-content:center;position:relative;margin:20px 0}.wheel{width:320px;height:320px;border-radius:50%;background:var(--field);border:1px solid var(--accent);position:relative}.digit-node{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700}.digit-node.active{background:#3b82f6;color:#fff}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}.center .digit{font-size:42px;font-weight:800;color:var(--accent)}.caption{font-size:10px;color:var(--muted)}.stake-row{display:flex;justify-content:space-between;align-items:center}.stake{font-size:26px;font-weight:800}.operate{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.operate:disabled{opacity:.55;cursor:wait}.note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}.symbol{display:flex;justify-content:space-between;align-items:center}.hidden{display:none!important}@media(min-width:800px){.wheel-wrap{min-height:370px;align-items:center}.wheel{width:350px;height:350px}}@media(max-width:599px){.wheel{width:260px;height:260px}.digit-node{width:44px;height:44px}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header"><div class="logo">I</div><div class="brand">Izi<span>trader</span></div><div class="header-actions"><button class="icon-btn" id="theme">☀️</button><button class="icon-btn" id="more">•••</button><button class="sair-btn" id="logout">Sair</button><div class="menu" id="menu"><div class="menu-item">Definições</div><div class="menu-item">Idioma</div><div class="menu-item">Ajuda</div></div></div></div>
<div class="card balance"><div><div class="label">SALDO</div><div class="value" id="balance">A carregar...</div></div><div class="divider"></div><div><div class="label">LUCRO/PERDA</div><div class="value profit" id="pnl">+$0.00</div></div></div>
<div class="row3"><div><div class="field-label">TIPO DE CONTA</div><select class="select" id="account"><option value="real">Real</option><option value="demo">Demo</option></select></div><div><div class="field-label">BOT</div><div class="dropdown"><button class="dropdown-btn" id="botBtn"><span id="botName">ProParity</span><span>▾</span></button><div class="dropdown-menu" id="botMenu"></div></div></div><div><div class="field-label">AULA</div><div class="pill pill-aula">▶</div></div></div>
<div class="card"><div class="field-label">HISTÓRICO RECENTE <span style="float:right">deslize para ver mais →</span></div><div class="history" id="history"></div></div>
<div class="status"><span class="dot" id="dot"></span><span id="status">A ligar à Deriv...</span></div>
<div class="wheel-wrap"><div class="wheel" id="wheel"><div class="center"><div class="digit" id="last">–</div><div class="caption">ÚLTIMO DÍGITO</div></div></div></div>
<div class="card"><div class="field-label">APOSTA <span style="float:right">mínimo: $0.35 USD</span></div><div class="stake-row"><span style="color:var(--muted);font-weight:700">USD</span><span class="stake">0.35</span></div><button class="operate" id="operate">INICIAR ROBÔ REAL</button><div class="note" id="note">Ligação de negociação autenticada pela sessão Deriv.</div></div>
<div class="card"><div class="field-label">SÍMBOLO</div><div class="symbol"><strong>R_100</strong><span style="color:var(--muted)">Volatility 100</span></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let ws=null,currentAccount=null,currentAccounts=[];let running=false;let lastBalance=null;let tradeBusy=false;
const bots=[['ProParity','Par (EVEN)','EVEN'],['Octawin','Dígito menor que 8 (UNDER 8)','UNDER'],['OddEz','Ímpar (ODD)','ODD'],['TradeSix','Dígito maior que 6 (OVER 6)','OVER']];
const menu=$('menu');$('more').onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};document.addEventListener('click',()=>menu.classList.remove('open'));
const bm=$('botMenu');bots.forEach(b=>{const x=document.createElement('div');x.className='dropdown-item';x.innerHTML='<strong>'+b[0]+'</strong><div class="desc">'+b[1]+'</div>';x.onclick=()=>{$('botName').textContent=b[0];$('botName').dataset.type=b[2];bm.classList.remove('open')};bm.appendChild(x)});$('botName').dataset.type='EVEN';$('botBtn').onclick=e=>{e.stopPropagation();bm.classList.toggle('open')};
$('theme').onclick=()=>{document.body.classList.toggle('light');document.documentElement.style.setProperty('--bg',document.body.classList.contains('light')?'#f3f5f8':'#0a0f1c');document.documentElement.style.setProperty('--card',document.body.classList.contains('light')?'#fff':'#111a2e');document.documentElement.style.setProperty('--field',document.body.classList.contains('light')?'#f7f8fa':'#131b2e');document.documentElement.style.setProperty('--text',document.body.classList.contains('light')?'#111827':'#fff')};
$('logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}finally{location.href='/'}};
const wheel=$('wheel');for(let i=0;i<10;i++){const a=i*Math.PI*2/10-Math.PI/2,n=document.createElement('div');n.className='digit-node';n.id='d'+i;n.textContent=i;n.style.left=(50+42*Math.cos(a))+'%';n.style.top=(50+42*Math.sin(a))+'%';n.style.transform='translate(-50%,-50%)';wheel.appendChild(n)}
function setStatus(text,ok=false){$('status').textContent=text;$('dot').classList.toggle('ok',ok)}
function setDigit(q){const s=String(q).replace(/\D/g,'');if(!s)return;const d=s.slice(-1);$('last').textContent=d;document.querySelectorAll('.digit-node').forEach(x=>x.classList.remove('active'));$('d'+d)?.classList.add('active');const h=document.createElement('div');h.className='history-item';h.innerHTML='<div class="digit">'+d+'</div><div style="font-size:10px;color:var(--muted)">tick</div>';$('history').prepend(h);while($('history').children.length>12)$('history').lastChild.remove()}
async function loadAccounts(){const r=await fetch('/api/deriv/accounts',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao carregar contas');currentAccounts=d.accounts||[];if(!currentAccounts.length)throw new Error('Nenhuma conta de Options encontrada');selectAccount();}
function selectAccount(){const want=$('account').value;currentAccount=currentAccounts.find(a=>String(a.account_type).toLowerCase()===want)||currentAccounts[0];$('account').value=String(currentAccount.account_type).toLowerCase();connect();}
async function connect(){if(!currentAccount)return;if(ws){try{ws.close()}catch{}};setStatus('A autenticar WebSocket '+currentAccount.account_type+'...',false);const r=await fetch('/api/deriv/ws-url?account_id='+encodeURIComponent(currentAccount.account_id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha no WebSocket');ws=new WebSocket(d.url);ws.onopen=()=>{setStatus('Deriv ligada — '+currentAccount.account_id,true);ws.send(JSON.stringify({balance:1,subscribe:1,req_id:1}));ws.send(JSON.stringify({ticks:'1HZ100V',subscribe:1,req_id:2}));};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.error){setStatus('Deriv: '+(m.error.message||'erro'),false);return}if(m.msg_type==='balance'){lastBalance=Number(m.balance.balance);$('balance').textContent=lastBalance.toFixed(2)+' '+(m.balance.currency||'USD')}if(m.msg_type==='tick'){setDigit(m.tick.quote)}}catch{}};ws.onerror=()=>setStatus('Erro na ligação Deriv',false);ws.onclose=()=>{if(running)setStatus('WebSocket encerrado',false)};}
$('account').onchange=()=>{const a=currentAccounts.find(x=>String(x.account_type).toLowerCase()===$('account').value);if(a){currentAccount=a;connect()}};
async function trade(){if(tradeBusy)return;if(!ws||ws.readyState!==WebSocket.OPEN){setStatus('A ligação Deriv ainda não está pronta',false);return}tradeBusy=true;$('operate').disabled=true;$('operate').textContent='A EXECUTAR...';const type=$('botName').dataset.type||'EVEN';const req={proposal:1,amount:0.35,basis:'stake',contract_type:type,currency:'USD',duration:1,duration_unit:'t',underlying_symbol:'1HZ100V',req_id:10};if(type==='OVER')req.barrier='6';if(type==='UNDER')req.barrier='8';const old=lastBalance;ws.send(JSON.stringify(req));const handler=e=>{try{const m=JSON.parse(e.data);if(m.req_id!==10)return;if(m.error){throw new Error(m.error.message||'Proposal error')}const p=m.proposal;if(!p?.id)throw new Error('Proposta inválida');ws.send(JSON.stringify({buy:p.id,price:Number(p.ask_price||p.display_value||0.35),req_id:11}));ws.removeEventListener('message',handler);const done=e2=>{try{const b=JSON.parse(e2.data);if(b.req_id!==11)return;if(b.error)throw new Error(b.error.message||'Compra recusada');setStatus('Contrato comprado — ID '+b.buy.contract_id,true);$('note').textContent='Operação enviada à Deriv. O resultado será atualizado pelo saldo.';ws.removeEventListener('message',done);setTimeout(()=>{tradeBusy=false;$('operate').disabled=false;$('operate').textContent='INICIAR ROBÔ REAL'},1500)}catch(err){setStatus(err.message,false);tradeBusy=false;$('operate').disabled=false;$('operate').textContent='INICIAR ROBÔ REAL';ws.removeEventListener('message',done)}};ws.addEventListener('message',done)}catch(err){setStatus(err.message,false);tradeBusy=false;$('operate').disabled=false;$('operate').textContent='INICIAR ROBÔ REAL';ws.removeEventListener('message',handler)}};ws.addEventListener('message',handler);}
$('operate').onclick=trade;
(async()=>{try{const r=await fetch('/api/auth/me',{cache:'no-store'});const d=await r.json();if(!d.user){location.href='/';return}if(!d.derivConnected)throw new Error('Conecte a conta Deriv primeiro');await loadAccounts();}catch(e){setStatus(e.message||'Não foi possível ligar à Deriv',false);$('balance').textContent='Indisponível';$('operate').disabled=true}})();
</script>
</body></html>
