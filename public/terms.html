en:[['1. Service','Izitrader is a technology interface that integrates analysis, automation and operation-tracking resources. Trading-account access and use are subject to the broker’s terms and applicable laws.'],['2. Risk','Financial trading can result in losses. The user is responsible for the decisions, amounts, strategies and settings used in the account. No result, tool or calculation shown by Izitrader guarantees profit.'],['3. Account and credentials','Users must protect credentials, tokens and devices. Do not share API keys, passwords or access codes with third parties.'],['4. Data and availability','Interruptions, delays, network errors or third-party outages may occur. Displayed information may be delayed and should be confirmed before an operational decision.'],['5. Affiliates and external links','Some links may direct users to third-party services. Those services are governed by their own terms.'],['6. Acceptance','By continuing to use the platform, the user confirms that these conditions have been read and accepts responsibility for use of the service.']],
es:[['1. Servicio','Izitrader es una interfaz tecnológica que integra recursos de análisis, automatización y seguimiento de operaciones. El acceso y uso de cuentas de trading están sujetos a las condiciones del bróker y a las leyes aplicables.'],['2. Riesgo','El trading financiero puede generar pérdidas. El usuario es responsable de las decisiones, importes, estrategias y configuraciones utilizadas. Ningún resultado, herramienta o cálculo mostrado por Izitrader garantiza ganancias.'],['3. Cuenta y credenciales','El usuario debe proteger sus credenciales, tokens y dispositivos. No comparta claves API, contraseñas ni códigos de acceso con terceros.'],['4. Datos y disponibilidad','Pueden producirse interrupciones, retrasos, errores de red o indisponibilidad de servicios de terceros. La información mostrada puede estar retrasada y debe verificarse antes de una decisión operativa.'],['5. Afiliados y enlaces externos','Algunos enlaces pueden dirigir a servicios de terceros. Dichos servicios se rigen por sus propias condiciones.'],['6. Aceptación','Al continuar utilizando la plataforma, el usuario declara haber leído estas condiciones y acepta la responsabilidad por el uso del servicio.']]
};
function getLang(){return localStorage.getItem('izitrader_language')||localStorage.getItem('izitrader_lang')||'pt'}
function render(){const l=['pt','en','es'].includes(getLang())?getLang():'pt';$('lang').value=l;document.documentElement.lang=l;$('title').textContent=l==='pt'?'📜 Termos e Condições':l==='en'?'📜 Terms and Conditions':'📜 Términos y Condiciones';$('body').innerHTML=content[l].map(x=>'<h2>'+x[0]+'</h2><p>'+x[1]+'</p>').join('')}
$('lang').addEventListener('change',()=>{localStorage.setItem('izitrader_language',$('lang').value);localStorage.setItem('izitrader_lang',$('lang').value);render()});render();
</script></body></html>
